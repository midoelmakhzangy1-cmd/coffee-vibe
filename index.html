<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Coffee Vibe | Specialty Coffee</title>
    <style>
        body { font-family: sans-serif; background-color: #fdfaf6; color: #333; text-align: center; margin: 0; }
        header { background: #d4af37; padding: 30px; color: white; }
        .menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        .card { background: white; border: 1px solid #ddd; border-radius: 15px; width: 220px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h3 { color: #d4af37; }
        .price { color: #2e7d32; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>Coffee Vibe ☕</h1>
        <p>قهوة مختصة وتحليات بسعادة</p>
    </header>
    <div class="menu">
        <div class="card"><h3>قهوة تركي</h3><p>مظبوطة</p><div class="price">45 ج.م</div></div>
        <div class="card"><h3>إسبانيش لاتيه</h3><p>منعش</p><div class="price">85 ج.م</div></div>
        <div class="card"><h3>تشيز كيك</h3><p>صوص التوت</p><div class="price">90 ج.م</div></div>
    </div>
</body>
</html>
